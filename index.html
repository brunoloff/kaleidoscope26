  <style>
    :root { color-scheme: dark; --ink: #111; --cream: #fff7df; --orange: #ff9d00; --muted: #b9ad94; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: var(--ink); color: var(--cream); font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    main { width: 100%; }
    .photo-shell { width: min(72rem, 100%); margin: 0 auto; overflow: hidden; background: #080808; }
    .photo-stage { position: relative; width: 100%; }
    .group-photo { display: block; width: 100%; height: auto; }
    .participant { cursor: pointer; outline: none; }
    .base-connector, .foreground-connector { vector-effect: non-scaling-stroke; pointer-events: none; transition: stroke .15s, stroke-width .15s, opacity .18s; }
    .base-connector { stroke: var(--cream); stroke-width: 3; opacity: .9; }
    .foreground-connector { stroke: var(--orange); stroke-width: 5; opacity: 0; }
    .foreground-connector.is-preview, .foreground-connector.is-pinned { opacity: 1; }
    .face-region { fill: #f59e0b12; stroke: var(--cream); stroke-width: 2; vector-effect: non-scaling-stroke; transition: fill .15s, stroke .15s, opacity .18s; }
    .person-label-bg { fill: #111e; stroke: var(--cream); stroke-width: 2; vector-effect: non-scaling-stroke; transition: fill .15s, stroke .15s, opacity .18s; }
    .person-label { fill: var(--cream); font: 750 38px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; text-anchor: middle; dominant-baseline: central; pointer-events: none; transition: opacity .18s; }
    .participant:hover .face-region, .participant:focus .face-region, .participant.is-pinned .face-region { fill: #ff9d0066; stroke: var(--orange); }
    .participant:hover .person-label-bg, .participant:focus .person-label-bg, .participant.is-pinned .person-label-bg { fill: var(--orange); stroke: var(--ink); }
    .participant:hover .person-label, .participant:focus .person-label, .participant.is-pinned .person-label { fill: var(--ink); }
    .labels-hover-only .base-connector,
    .labels-hover-only .participant .face-region,
    .labels-hover-only .participant .person-label-bg,
    .labels-hover-only .participant .person-label { opacity: 0; }
    .labels-hover-only .participant:hover .face-region,
    .labels-hover-only .participant:focus .face-region,
    .labels-hover-only .participant.is-preview .face-region,
    .labels-hover-only .participant.is-pinned .face-region,
    .labels-hover-only .participant:hover .person-label-bg,
    .labels-hover-only .participant:focus .person-label-bg,
    .labels-hover-only .participant.is-preview .person-label-bg,
    .labels-hover-only .participant.is-pinned .person-label-bg,
    .labels-hover-only .participant:hover .person-label,
    .labels-hover-only .participant:focus .person-label,
    .labels-hover-only .participant.is-preview .person-label,
    .labels-hover-only .participant.is-pinned .person-label { opacity: 1; }
    .label-toggle { position: absolute; z-index: 5; top: .65rem; right: .65rem; padding: .55rem .75rem; border: 1px solid #695d46; border-radius: .35rem; background: #111e; color: var(--cream); box-shadow: 0 2px 10px #0008; font: 800 .9rem/1 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; cursor: pointer; }
    .label-toggle:hover, .label-toggle:focus-visible { border-color: var(--orange); outline: none; }
    .label-toggle[aria-pressed="true"] { border-color: var(--orange); background: var(--orange); color: var(--ink); }
    .person-detail { position: absolute; z-index: 3; left: 50%; bottom: 1rem; width: min(44rem, calc(100% - 2rem)); margin: 0; padding: 1rem 1.2rem; transform: translateX(-50%); border: 2px solid var(--orange); border-radius: .55rem; background: #111f; box-shadow: 0 10px 30px #0009; }
    .person-detail[hidden] { display: none; }
    .person-detail h2 { margin: 0 0 .85rem; font: 800 clamp(1.35rem, 3vw, 2rem)/1.1 system-ui, sans-serif; }
    .person-detail dl { display: grid; grid-template-columns: max-content 1fr; gap: .45rem 1rem; margin: 0; }
    .person-detail dt { color: var(--muted); }
    .person-detail dd { margin: 0; overflow-wrap: anywhere; }
    .person-detail a { color: var(--orange); }
    @media (max-width: 700px) { .label-toggle { top: .4rem; right: .4rem; padding: .45rem .6rem; font-size: .72rem; } .person-detail { bottom: .5rem; width: calc(100% - 1rem); padding: .7rem .8rem; } .person-detail h2 { margin-bottom: .5rem; } .person-detail dl { grid-template-columns: max-content 1fr; } }
  </style>

  <script>
    const sheetCsvUrl = 'https://docs.google.com/spreadsheets/d/1rpXp_W1sz8pOjrp6FYiXxvMJA0uTw1o-kwLfoUe0TSQ/gviz/tq?tqx=out:csv&sheet=Identifications&range=A4:D51';
    const liveSheetEnabled = false;
    const groups = [...document.querySelectorAll('.participant')];
    const foregroundConnectors = new Map(
      [...document.querySelectorAll('.foreground-connector')].map(line => [Number(line.dataset.participant), line])
    );
    const detail = document.querySelector('.person-detail');
    const labelToggle = document.querySelector('.label-toggle');
    const detailName = document.querySelector('[data-detail-name]');
    const detailEmail = document.querySelector('[data-detail-email]');
    const savedPeople = JSON.parse(document.querySelector('#people-data').textContent);
    const people = new Map(savedPeople.map(person => [Number(person.number), normalisePerson(person)]));
    let pinnedNumber = null;
    let hoverOnly = false;

    try { hoverOnly = localStorage.getItem('group-photo-label-mode') === 'hover'; } catch (_) {}

    function applyLabelMode() {
      document.body.classList.toggle('labels-hover-only', hoverOnly);
      labelToggle.setAttribute('aria-pressed', String(hoverOnly));
      labelToggle.textContent = hoverOnly ? 'Labels: hover only' : 'Labels: always visible';
    }

    labelToggle.addEventListener('click', () => {
      hoverOnly = !hoverOnly;
      try { localStorage.setItem('group-photo-label-mode', hoverOnly ? 'hover' : 'all'); } catch (_) {}
      applyLabelMode();
    });

    function normalisePerson(person) {
      return {
        number: Number(person.number),
        row: String(person.row || ''),
        name: String(person.name || '').trim(),
        email: String(person.email || '').trim()
      };
    }

    function visibleName(person) { return person.name || 'Unknown'; }
    function shortName(name) { return name.length <= 23 ? name : `${name.slice(0, 22).trim()}…`; }

    function updateLabels() {
      groups.forEach(group => {
        const number = Number(group.dataset.participant);
        const person = people.get(number) || normalisePerson({ number });
        const name = visibleName(person);
        group.querySelector('[data-label]').textContent = shortName(name);
        group.setAttribute('aria-label', `Participant ${number}: ${name}`);
        const title = group.querySelector('title');
        if (title) title.textContent = `Participant ${number}: ${name}`;
      });
      if (pinnedNumber !== null) showDetails(pinnedNumber);
    }

    function setTextOrLink(container, value, kind) {
      container.replaceChildren();
      if (!value) {
        container.textContent = 'Not provided';
        return;
      }
      const link = document.createElement('a');
      link.textContent = value;
      if (kind === 'email') {
        link.href = `mailto:${value}`;
      } else {
        let candidate = /^https?:\/\//i.test(value) ? value : `https://${value}`;
        try {
          const parsed = new URL(candidate);
          link.href = ['http:', 'https:'].includes(parsed.protocol) ? parsed.href : '#';
        } catch (_) {
          link.href = '#';
        }
        link.target = '_blank';
        link.rel = 'noopener noreferrer';
      }
      container.append(link);
    }

    function showDetails(number) {
      const person = people.get(Number(number)) || normalisePerson({ number });
      detailName.textContent = visibleName(person);
      setTextOrLink(detailEmail, person.email, 'email');
      detail.hidden = false;
    }

    function hideDetails() {
      if (pinnedNumber === null) detail.hidden = true;
    }

    function pin(number) {
      pinnedNumber = Number(number);
      groups.forEach(group => group.classList.toggle('is-pinned', Number(group.dataset.participant) === pinnedNumber));
      foregroundConnectors.forEach((line, participant) => line.classList.toggle('is-pinned', participant === pinnedNumber));
      showDetails(pinnedNumber);
    }

    function clearPin() {
      pinnedNumber = null;
      groups.forEach(group => group.classList.remove('is-pinned'));
      foregroundConnectors.forEach(line => line.classList.remove('is-pinned'));
      detail.hidden = true;
    }

    function setPreview(group, active) {
      const number = Number(group.dataset.participant);
      group.classList.toggle('is-preview', active);
      foregroundConnectors.get(number)?.classList.toggle('is-preview', active);
    }

    groups.forEach(group => {
      const number = Number(group.dataset.participant);
      group.addEventListener('mouseenter', () => { setPreview(group, true); if (pinnedNumber === null) showDetails(number); });
      group.addEventListener('mouseleave', () => { setPreview(group, false); if (pinnedNumber === null) hideDetails(); });
      group.addEventListener('focus', () => { setPreview(group, true); if (pinnedNumber === null) showDetails(number); });
      group.addEventListener('blur', () => { setPreview(group, false); if (pinnedNumber === null) hideDetails(); });
      group.addEventListener('click', event => { event.stopPropagation(); pin(number); });
      group.addEventListener('keydown', event => {
        if (event.key === 'Enter' || event.key === ' ') {
          event.preventDefault();
          event.stopPropagation();
          pin(number);
        }
      });
    });

    document.addEventListener('click', event => {
      if (!event.target.closest('.participant') && !event.target.closest('.person-detail')) clearPin();
    });
    document.addEventListener('keydown', event => { if (event.key === 'Escape') clearPin(); });

    function parseCsv(text) {
      const rows = [];
      let row = [], cell = '', quoted = false;
      for (let i = 0; i < text.length; i += 1) {
        const char = text[i];
        if (quoted) {
          if (char === '"' && text[i + 1] === '"') { cell += '"'; i += 1; }
          else if (char === '"') quoted = false;
          else cell += char;
        } else if (char === '"') quoted = true;
        else if (char === ',') { row.push(cell); cell = ''; }
        else if (char === '\n') { row.push(cell.replace(/\r$/, '')); rows.push(row); row = []; cell = ''; }
        else cell += char;
      }
      if (cell || row.length) { row.push(cell.replace(/\r$/, '')); rows.push(row); }
      return rows;
    }

    async function refreshFromSheet() {
      try {
        const response = await fetch(sheetCsvUrl, { cache: 'no-store' });
        if (!response.ok) throw new Error(`Sheet returned ${response.status}`);
        const rows = parseCsv(await response.text());
        const headerIndex = rows.findIndex(row => String(row[0] || '').trim().toLowerCase() === 'number');
        if (headerIndex < 0) throw new Error('Sheet header was not found');
        rows.slice(headerIndex + 1).forEach(row => {
          const number = Number(row[0]);
          if (!Number.isInteger(number) || number < 1 || number > 47) return;
          people.set(number, normalisePerson({ number, row: row[1], name: row[2], email: row[3] }));
        });
        updateLabels();
      } catch (error) {
        console.info('Live Sheet data unavailable; using embedded snapshot.', error);
      }
    }

    applyLabelMode();
    updateLabels();
    if (liveSheetEnabled) refreshFromSheet();
  </script>
